# Production-oriented compose stack for the SOC-AGENTS platform.
#
# Services:
#   backend   - FastAPI API, runs idempotent migrations on boot.
#   frontend  - Next.js production build of the SOC console.
#   postgres  - PostgreSQL 16 with pgvector (semantic search / agent memory).
#   redis     - Redis 7 for caching, rate-limit tokens and job queues.
#   seed      - One-shot service that provisions the demo tenant and
#               detection rules after migrations complete (idempotent).
#
# Usage:
#   docker compose up --build        # start the full stack
#   docker compose run seed          # re-seed demo data
#   docker compose down -v           # stop and wipe all data

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://soc:soc@postgres:5432/soc
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3100"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: soc
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d soc"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m

  seed:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://soc:soc@postgres:5432/soc
      APP_ENV: local
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      ["python", "/app/scripts/seed_demo_tenant.py"]
    profiles:
      - seed

volumes:
  postgres-data:
