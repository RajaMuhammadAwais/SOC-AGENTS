[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-soc-backend"
version = "0.1.0"
description = "FastAPI backend for the Enterprise AI SOC platform."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi[standard]>=0.115",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2,<9",
  "joserfc>=1.0",
  "passlib[argon2]>=1.7",
  "structlog>=24.4",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "httpx>=0.27",
  "pinecone[asyncio]>=7,<8",
  "pgvector>=0.3",
  "langgraph>=0.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13"
]
embeddings = [
  "FlagEmbedding>=1.3"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends(...) in parameter defaults is the standard pattern
    "E501",  # long lines addressed per-case; formatter target stays 100
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "F841", "S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require external services (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
